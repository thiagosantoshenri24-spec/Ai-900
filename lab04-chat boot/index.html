< !DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atendimento - FAQ Empresa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b141a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,168,132,0.12) 0%, transparent 70%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* ── Chat Container ── */
    #chat-container {
      width: 100%;
      max-width: 820px;
      height: 92vh;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 32px 80px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.06);
      background-color: #111b21;
    }

    /* ── Header ── */
    #chat-header {
      background: linear-gradient(135deg, #1f2c34 0%, #192029 100%);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .header-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00a884 0%, #007a62 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(0,168,132,0.35);
    }

    .header-avatar svg { width: 24px; height: 24px; fill: #fff; }

    .header-info { flex: 1; }
    .header-info h1 {
      font-size: 15px;
      font-weight: 600;
      color: #e9edef;
      letter-spacing: 0.1px;
      margin: 0;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00a884;
      box-shadow: 0 0 6px rgba(0,168,132,0.8);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.55; transform: scale(0.85); }
    }

    .status-text {
      font-size: 12px;
      color: #8696a0;
      font-weight: 400;
    }

    /* ── Messages Area ── */
    #messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-color: #0b141a;
      background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='p' x='0' y='0' width='50' height='50' patternUnits='userSpaceOnUse'%3E%3Cpath d='M25 0 L50 25 L25 50 L0 25 Z' fill='none' stroke='rgba(255,255,255,0.018)' stroke-width='1'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='400' height='400' fill='url(%23p)'/%3E%3C/svg%3E");
    }

    #messages-area::-webkit-scrollbar { width: 5px; }
    #messages-area::-webkit-scrollbar-track { background: transparent; }
    #messages-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    /* ── Date Divider ── */
    .date-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
    }

    .date-divider span {
      background: rgba(17,27,33,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      color: #8696a0;
      font-size: 11.5px;
      padding: 4px 12px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    /* ── Message Rows ── */
    .message-row {
      display: flex;
      width: 100%;
      margin-bottom: 2px;
      animation: fadeInUp 0.22s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-row.user   { justify-content: flex-end; }
    .message-row.bot    { justify-content: flex-start; }

    /* ── Bubbles ── */
    .bubble {
      max-width: 68%;
      padding: 8px 12px 6px;
      border-radius: 8px;
      position: relative;
      word-break: break-word;
      line-height: 1.55;
    }

    /* tail */
    .bubble::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0; height: 0;
    }

    .message-row.user .bubble {
      background-color: #005c4b;
      color: #e9edef;
      border-top-right-radius: 2px;
    }

    .message-row.user .bubble::before {
      right: -8px;
      border-left: 8px solid #005c4b;
      border-bottom: 8px solid transparent;
    }

    .message-row.bot .bubble {
      background-color: #202c33;
      color: #e9edef;
      border-top-left-radius: 2px;
    }

    .message-row.bot .bubble::before {
      left: -8px;
      border-right: 8px solid #202c33;
      border-bottom: 8px solid transparent;
    }

    .bubble-text {
      font-size: 14px;
      font-weight: 400;
    }

    .bubble-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 3px;
    }

    .bubble-time {
      font-size: 10.5px;
      color: rgba(134,150,160,0.9);
    }

    .message-row.user .bubble .check-icon svg {
      width: 16px; height: 16px;
      fill: #53bdeb;
    }

    /* ── Typing Indicator ── */
    #typing-indicator {
      display: none;
      justify-content: flex-start;
      padding-left: 2px;
      margin-bottom: 4px;
      animation: fadeInUp 0.22s ease both;
    }

    .typing-bubble {
      background-color: #202c33;
      border-radius: 8px;
      border-top-left-radius: 2px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .typing-dot {
      width: 7px; height: 7px;
      background: #8696a0;
      border-radius: 50%;
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.5; }
      30%            { transform: translateY(-6px); opacity: 1;   }
    }

    /* ── Error Bubble ── */
    .bubble.error {
      background-color: #3d1e1e;
      border-left: 3px solid #e74c3c;
    }

    .bubble.error .bubble-text { color: #f1948a; }

    /* ── Input Area ── */
    #input-area {
      background: #202c33;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    #message-input {
      flex: 1;
      background: #2a3942;
      border: none;
      border-radius: 24px;
      padding: 10px 18px;
      color: #e9edef;
      font-size: 14.5px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: background 0.2s;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    #message-input::placeholder { color: #8696a0; }
    #message-input:focus { background: #31444e; }

    #send-button {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #00a884 0%, #00836a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 12px rgba(0,168,132,0.4);
    }

    #send-button:hover {
      transform: scale(1.07);
      box-shadow: 0 4px 18px rgba(0,168,132,0.55);
    }

    #send-button:active { transform: scale(0.95); }
    #send-button svg { width: 22px; height: 22px; fill: #fff; }

    /* ── Empty State ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #8696a0;
      text-align: center;
      padding: 30px;
    }

    #empty-state svg { width: 56px; height: 56px; opacity: 0.3; fill: #8696a0; }
    #empty-state p { font-size: 14px; line-height: 1.6; max-width: 280px; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      #chat-container { height: 100vh; max-height: none; border-radius: 0; }
      .bubble { max-width: 82%; }
    }
  </style>
</head>
<body>

<div id="chat-container">

  <!-- Header -->
  <div id="chat-header">
    <div class="header-avatar">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l5.09-1.34C8.48 21.52 10.2 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.67 0-3.22-.46-4.55-1.26l-.32-.19-3.02.8.81-2.95-.21-.34C3.47 15.19 3 13.65 3 12 3 7.03 7.03 3 12 3s9 4.03 9 9-4.03 9-9 9zm5-6.5c-.28-.14-1.63-.8-1.88-.89-.25-.09-.43-.14-.62.14-.18.28-.71.89-.87 1.07-.16.18-.32.21-.6.07-.28-.14-1.17-.43-2.23-1.37-.82-.73-1.38-1.63-1.54-1.91-.16-.28-.02-.43.12-.57.13-.12.28-.32.42-.48.14-.16.18-.28.28-.46.09-.18.05-.34-.02-.48-.07-.14-.62-1.49-.85-2.04-.22-.53-.45-.46-.62-.47H8.5c-.18 0-.46.07-.7.34-.25.28-.94.92-.94 2.24s.96 2.6 1.1 2.78c.13.18 1.89 2.88 4.58 4.04.64.28 1.14.44 1.53.56.64.2 1.23.17 1.69.1.52-.08 1.63-.67 1.86-1.31.23-.64.23-1.19.16-1.31-.07-.11-.25-.18-.53-.32z"/></svg>
    </div>
    <div class="header-info">
      <h1>Atendimento — FAQ Empresa</h1>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span class="status-text">Online agora</span>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div id="messages-area">
    <div id="empty-state">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <p>Olá! Como posso ajudar você hoje? Digite sua dúvida abaixo.</p>
    </div>

    <div id="typing-indicator">
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div id="input-area">
    <textarea
      id="message-input"
      placeholder="Digite uma mensagem"
      rows="1"
      autocomplete="off"
      spellcheck="true"
    ></textarea>
    <button id="send-button" title="Enviar">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ── CONFIG — substitua com seus dados reais ──────────────────────────────
  const AZURE_ENDPOINT = "https://thiagohenrique.cognitiveservices.azure.com/language/:query-knowledgebases";
  const AZURE_PROJECT   = "thiagohenrique";
  const AZURE_API_VER   = "2021-10-01";
  const AZURE_DEPLOY    = "test";
  const AZURE_KEY       = "A9p8HOv4LB9JdXsBfCMdsAhhwNceqkcm0nH61qjLu7YhvX5I8gsxJQQJ99CCACZoyfiXJ3w3AAAaACOGv0bs";
  // ─────────────────────────────────────────────────────────────────────────

  const messagesArea   = document.getElementById("messages-area");
  const typingIndicator = document.getElementById("typing-indicator");
  const messageInput   = document.getElementById("message-input");
  const sendButton     = document.getElementById("send-button");
  const emptyState     = document.getElementById("empty-state");

  // Auto-resize textarea
  messageInput.addEventListener("input", () => {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + "px";
  });

  // Send on Enter (Shift+Enter = new line)
  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  sendButton.addEventListener("click", handleSend);

  function getTime() {
    return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function removeEmptyState() {
    if (emptyState && emptyState.parentNode) emptyState.remove();
  }

  function scrollBottom() {
    messagesArea.scrollTo({ top: messagesArea.scrollHeight, behavior: "smooth" });
  }

  function appendMessage(text, role, isError = false) {
    removeEmptyState();

    const row = document.createElement("div");
    row.className = `message-row ${role}`;

    const bubble = document.createElement("div");
    bubble.className = `bubble${isError ? " error" : ""}`;

    const textEl = document.createElement("div");
    textEl.className = "bubble-text";
    textEl.textContent = text;

    const meta = document.createElement("div");
    meta.className = "bubble-meta";

    const timeEl = document.createElement("span");
    timeEl.className = "bubble-time";
    timeEl.textContent = getTime();
    meta.appendChild(timeEl);

    // Double check ticks for user messages
    if (role === "user") {
      const checkEl = document.createElement("span");
      checkEl.className = "check-icon";
      checkEl.innerHTML = `<svg viewBox="0 0 18 18"><path d="M17.394 5.035l-.57-.444a.434.434 0 0 0-.609.076L8.297 14.465l-4.492-4.465a.437.437 0 0 0-.614.007l-.505.509a.436.436 0 0 0 .007.614l5.332 5.301 9.361-11.989a.436.436 0 0 0-.078-.607zM1.08 7.904l5.332 5.3.505-.508-5.26-5.225-.577.433z"/></svg>`;
      meta.appendChild(checkEl);
    }

    bubble.appendChild(textEl);
    bubble.appendChild(meta);
    row.appendChild(bubble);

    // Insert before typing indicator
    messagesArea.insertBefore(row, typingIndicator);
    scrollBottom();
  }

  function showTyping() {
    typingIndicator.style.display = "flex";
    scrollBottom();
  }

  function hideTyping() {
    typingIndicator.style.display = "none";
  }

  async function queryAzure(question) {
    const url = `${AZURE_ENDPOINT}?projectName=${AZURE_PROJECT}&api-version=${AZURE_API_VER}&deploymentName=${AZURE_DEPLOY}`;

    const response = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Ocp-Apim-Subscription-Key": AZURE_KEY
      },
      body: JSON.stringify({ top: 1, question })
    });

    if (!response.ok) {
      throw new Error(`Erro HTTP ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();

    if (data.answers && data.answers.length > 0) {
      const answer = data.answers[0].answer;
      // Azure retorna "No good match found in the knowledge base." quando não encontra
      if (answer && answer !== "No good match found in the knowledge base.") {
        return answer;
      }
    }
    return "Desculpe, não encontrei uma resposta para sua dúvida. Tente reformular a pergunta ou entre em contato com nosso suporte.";
  }

  async function handleSend() {
    const text = messageInput.value.trim();
    if (!text) return;

    // Clear & reset input
    messageInput.value = "";
    messageInput.style.height = "auto";

    // Show user bubble
    appendMessage(text, "user");

    // Show typing
    showTyping();
    sendButton.disabled = true;
    messageInput.disabled = true;

    try {
      const answer = await queryAzure(text);
      hideTyping();
      appendMessage(answer, "bot");
    } catch (err) {
      hideTyping();
      appendMessage(`⚠️ Falha ao obter resposta: ${err.message}`, "bot", true);
      console.error("[FAQ Chat] Erro na requisição:", err);
    } finally {
      sendButton.disabled = false;
      messageInput.disabled = false;
      messageInput.focus();
    }
  }

  // Focus input on load
  window.addEventListener("load", () => messageInput.focus());
</script>
</body>
</html>
